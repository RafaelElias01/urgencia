<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Nova solicitacao')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div th:replace="~{layout :: flash}"></div>

<div class="container my-4 container-narrow">
    <h1 class="h3 mb-3"><i class="bi bi-send-plus"></i> Nova solicitacao</h1>
    <p class="small text-muted">* Campo obrigatorio</p>

    <form th:action="@{/solicitante/nova}" th:object="${solicitacao}" method="post"
          enctype="multipart/form-data" class="card">
        <div class="card-body">
            <h2 class="h6 text-muted">Equipe solicitante</h2>
            <div class="row g-3 mb-2">
                <div class="col-md-8">
                    <label class="form-label">Equipe / hospital</label>
                    <input type="text" class="form-control" th:value="${equipe}" disabled readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label">E-mail</label>
                    <input type="text" class="form-control" th:value="${email}" disabled readonly>
                </div>
            </div>
            <p class="small text-muted">
                Preenchidos automaticamente a partir do seu cadastro (nao editaveis aqui).
            </p>

            <hr>
            <h2 class="h6 text-muted">Paciente</h2>
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label" th:for="pacienteNome">Nome do paciente *</label>
                    <input type="text" th:field="*{pacienteNome}" class="form-control" maxlength="200" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label" th:for="pacienteRgct">RGCT / SNT *</label>
                    <input type="text" th:field="*{pacienteRgct}" class="form-control" placeholder="123456789-12345" required maxlength="60">
                </div>
            </div>

            <hr>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" th:for="dataSituacaoEspecial">Data de solicitacao da urgencia renal *</label>
                    <input type="date" th:field="*{dataSituacaoEspecial}" class="form-control" required>
                </div>
            </div>

            <hr>
            <div>
                <label class="form-label" th:for="justificativaClinica">Justificativa clinica *</label>
                <textarea th:field="*{justificativaClinica}" class="form-control" rows="5" required
                          placeholder="Descreva o quadro clinico e o motivo do pedido de urgencia renal."></textarea>
            </div>

            <hr>
            <div>
                <label class="form-label" th:for="documentos">Documentos clinicos</label>
                <input type="file" id="documentos" name="documentos" class="form-control" multiple
                       accept=".pdf,.png,.jpg,.jpeg,.eml,.msg">
                <div class="form-text text-muted">
                    PDF, imagem (PNG/JPG) ou copia do e-mail (EML/MSG). Pode selecionar varios arquivos.
                </div>
                <div id="documentosSelecionados" class="small text-muted mt-1"></div>
            </div>
        </div>
        <div class="card-footer text-end">
            <a th:href="@{/solicitante}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-send"></i> Enviar solicitacao
            </button>
        </div>
    </form>
</div>

<script th:replace="~{layout :: scripts}"></script>
<script th:src="@{/js/solicitante-nova.js}"></script>
<div th:replace="~{layout :: footer}"></div>
</body>
</html>
